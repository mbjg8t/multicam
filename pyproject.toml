[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multicam"
version = "0.1.0"
description = "Portable multi-camera acquisition, overlay, alignment and imaging framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["multicam*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
