<!doctype html>
<html>
<head>
    <title>Multicam DSP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dsp.css') }}">
</head>
<body>
    <header>
        <h1>DSP Workbench</h1>
        <label>
            Camera
            <select id="dsp-camera"></select>
        </label>
        <label class="enable-option">
            <input id="dsp-enabled" type="checkbox">
            Enable DSP and use it in live view
        </label>
        <button id="reset-dsp">Reset</button>
        <span id="dsp-status">Loading cameras…</span>
    </header>

    <main>
        <section class="previews">
            <figure>
                <figcaption>Raw broker frame</figcaption>
                <img id="raw-preview" alt="Raw camera preview">
            </figure>
            <figure>
                <figcaption>Processed display variant</figcaption>
                <img id="processed-preview" alt="Processed camera preview">
            </figure>
        </section>

        <section class="controls">
            <h2>Geometry-preserving display pipeline</h2>
            <div class="control-grid">
                <label>Black percentile <output id="black-value"></output></label>
                <input id="black-percentile" type="range" min="0" max="25" step="0.1">

                <label>White percentile <output id="white-value"></output></label>
                <input id="white-percentile" type="range" min="75" max="100" step="0.1">

                <label>Gamma <output id="gamma-value"></output></label>
                <input id="gamma" type="range" min="0.1" max="4" step="0.05">

                <label>Denoise radius <output id="denoise-value"></output></label>
                <input id="denoise-radius" type="range" min="0" max="3" step="1">

                <label>Sharpen <output id="sharpen-value"></output></label>
                <input id="sharpen" type="range" min="0" max="3" step="0.05">

                <label>Maximum DSP FPS <output id="fps-value"></output></label>
                <input id="max-fps" type="range" min="1" max="60" step="1">

                <label>Palette</label>
                <select id="palette">
                    <option value="normal">Normal</option>
                    <option value="grayscale">Grayscale</option>
                    <option value="iron">Iron</option>
                </select>

                <label class="check"><input id="grayscale" type="checkbox"> Force grayscale</label>
                <label class="check"><input id="invert" type="checkbox"> Invert</label>
            </div>
            <p>
                Enable DSP to activate the processed preview. This pipeline changes
                display pixels only. Raw broker frames remain
                available to Focus, Alignment, capture, and future MTF measurements.
            </p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/dsp.js') }}"></script>
</body>
</html>
