<!doctype html>
<html>
<head>
    <title>Multicam DSP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dsp.css') }}">
</head>
<body>
    <header>
        <h1>DSP Workbench</h1>
        <label>
            Camera
            <select id="dsp-camera"></select>
        </label>
        <label class="enable-option">
            <input id="dsp-enabled" type="checkbox">
            Enable DSP and use it in live view
        </label>
        <button id="reset-dsp">Reset</button>
        <span id="dsp-status">Loading cameras…</span>
    </header>

    <main>
        <section class="previews">
            <figure>
                <figcaption>Selected camera — DSP bypassed</figcaption>
                <img id="raw-preview" alt="Raw camera preview">
            </figure>
            <figure>
                <figcaption>Selected camera — DSP processed</figcaption>
                <img id="processed-preview" alt="Processed camera preview">
            </figure>
        </section>

        <section class="controls">
            <h2>Geometry-preserving display pipeline</h2>
            <div class="control-grid">
                <label>Levels</label>
                <select id="levels-mode">
                    <option value="off">Off</option>
                    <option value="minmax">Automatic min/max</option>
                    <option value="percentile">Percentile stretch</option>
                </select>
                <div class="paired-ranges" id="levels-controls">
                    <label>Black <output id="black-value"></output></label>
                    <input id="black-percentile" type="range" min="0" max="25" step="0.1">
                    <label>White <output id="white-value"></output></label>
                    <input id="white-percentile" type="range" min="75" max="100" step="0.1">
                </div>

                <label>Gamma</label>
                <select id="gamma-mode">
                    <option value="off">Off</option>
                    <option value="gamma">Power gamma</option>
                </select>
                <div class="single-range">
                    <output id="gamma-value"></output>
                    <input id="gamma" type="range" min="0.1" max="4" step="0.05">
                </div>

                <label>Denoise</label>
                <select id="denoise-mode">
                    <option value="off">Off</option>
                    <option value="box">Box blur</option>
                    <option value="gaussian">Gaussian blur</option>
                    <option value="median">Median filter</option>
                </select>
                <div class="single-range">
                    <output id="denoise-value"></output>
                    <input id="denoise-radius" type="range" min="0" max="3" step="1">
                </div>

                <label>Sharpen</label>
                <select id="sharpen-mode">
                    <option value="off">Off</option>
                    <option value="unsharp">Unsharp mask</option>
                    <option value="sharpen">Sharpen kernel</option>
                    <option value="edge_enhance">Edge enhance</option>
                </select>
                <div class="single-range">
                    <output id="sharpen-value"></output>
                    <input id="sharpen" type="range" min="0" max="3" step="0.05">
                </div>

                <label>Edges / lines</label>
                <select id="edge-mode">
                    <option value="off">Off</option>
                    <option value="sobel">Fast 3×3 edges</option>
                    <option value="laplacian">Laplacian edges</option>
                </select>
                <div class="single-range">
                    <output id="edge-value"></output>
                    <input id="edge-strength" type="range" min="0" max="1" step="0.05">
                </div>

                <label>Palette</label>
                <select id="palette">
                    <option value="normal">Normal</option>
                    <option value="grayscale">Grayscale</option>
                    <option value="iron">Iron</option>
                </select>
                <span></span>

                <label>Invert</label>
                <select id="invert">
                    <option value="false">Off</option>
                    <option value="true">On</option>
                </select>
                <span></span>

                <label>Maximum DSP FPS</label>
                <span></span>
                <div class="single-range">
                    <output id="fps-value"></output>
                    <input id="max-fps" type="range" min="1" max="60" step="1">
                </div>
            </div>
            <p>
                Enable DSP to activate the processed preview. This pipeline changes
                display pixels only. Raw broker frames remain
                available to Focus, Alignment, capture, and future MTF measurements.
            </p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/dsp.js') }}"></script>
</body>
</html>
