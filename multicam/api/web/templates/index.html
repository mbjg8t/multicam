<!doctype html>
<html>
<head>
    <title>Multicam</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="title">Multicam 1.0</div>

            <nav class="tool-buttons" aria-label="Multicam tools">
                <button onclick="window.open('/cameras', 'multicam-cameras')">Cameras</button>
                <button id="open-alignment">Alignment</button>
                <button id="open-focus">Focus</button>
                <button id="open-dsp">DSP</button>
                <button onclick="window.open('/mtf', 'multicam-mtf')">MTF</button>
            </nav>
        </div>

        <div id="camera-strip" class="camera-strip"></div>

        <div id="viewer" class="viewer">
            <img id="live-image" src="/stream" draggable="false">
            <canvas id="frozen-image" aria-label="Frozen live frame"></canvas>
            <div class="zoom-controls" aria-label="Live view zoom controls">
                <button id="freeze-live" title="Freeze the displayed live frame">Freeze</button>
                <button id="zoom-out" title="Zoom out">−</button>
                <span id="zoom-label">100%</span>
                <button id="zoom-in" title="Zoom in">+</button>
                <button id="zoom-fit" title="Fit image">Fit</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
