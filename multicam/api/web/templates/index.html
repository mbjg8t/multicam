<!doctype html>
<html>
<head>
    <title>Multicam</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="title">Multicam 1.0</div>

            <button onclick="window.open('/cameras', 'multicam-cameras')">
                Cameras
            </button>

            <div class="quick-alignment">
                <label>
                    Align to
                    <select id="reference-camera"></select>
                </label>

                <label>
                    Transform
                    <select id="target-camera"></select>
                </label>
            </div>

            <button id="open-alignment">Alignment</button>
            <button id="open-focus">Focus</button>
            <button disabled>MTF</button>
        </div>

        <div id="camera-strip" class="camera-strip"></div>

        <div class="viewer">
            <img src="/stream">
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
